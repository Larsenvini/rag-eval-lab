<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background: deep navy, same as the UI bg -->
  <rect width="32" height="32" rx="6" fill="#0d1424"/>

  <!-- Outer square: K8s blue, rotated 12deg, offset slightly -->
  <rect x="6" y="6" width="20" height="20" rx="2"
        fill="none" stroke="#326ce5" stroke-width="2"
        transform="rotate(12 16 16)"/>

  <!-- Inner square: white, slightly smaller, rotated opposite -->
  <rect x="10" y="10" width="12" height="12" rx="1.5"
        fill="none" stroke="#ffffff" stroke-width="2"
        transform="rotate(-12 16 16)"/>

  <!-- Central dot — the answer "core" -->
  <circle cx="16" cy="16" r="1.5" fill="#326ce5"/>
</svg>
