app = "rag-eval-lab"            # Edit this if the name is taken: fly will tell you.
primary_region = "gru"          # São Paulo — closest to you in Rio. Change if needed.

# ─── Build ───────────────────────────────────────────────────────────────
[build]
  dockerfile = "Dockerfile"

# ─── HTTP / TLS ───────────────────────────────────────────────────────────
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # Stop machine when idle (saves money)
  auto_start_machines = true    # Wake on incoming request (~5-10s cold start)
  min_machines_running = 0      # Allow full sleep
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

# ─── Healthcheck (matches the Dockerfile HEALTHCHECK) ─────────────────────
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

# ─── Machines ─────────────────────────────────────────────────────────────
# 1 shared CPU + 512MB is enough for our load. Chroma + the embeddings
# we ship total well under 200MB; FastAPI itself is light.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
