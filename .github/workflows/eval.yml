name: eval

# ─── When this runs ───────────────────────────────────────────────────────
# - PRs targeting main, only when files that could affect eval are touched
# - Pushes to main, same path filter
# - Manual dispatch from the Actions tab
#
# Mitigations baked in to keep cost & noise down:
# - paths filter (docs-only commits don't trigger eval)
# - [skip-eval] in the commit message bypasses the job
# - workflow_dispatch lets you manually re-run if needed
# - concurrency cancels in-flight runs for the same PR if you push again
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "evals/**"
      - "requirements.txt"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "evals/**"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: eval-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # needed for posting PR comments

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Honor [skip-eval] in any line of the commit/PR-head message
    if: ${{ !contains(github.event.head_commit.message, '[skip-eval]') }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download K8s docs corpus
        run: python -m scripts.download_corpus

      - name: Ingest corpus into Chroma
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.ingest

      - name: Run eval against golden set
        id: run_eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Use the locked working point. Explicit > implicit on CI.
          DEFAULT_RETRIEVER: hybrid
        run: |
          python -m scripts.run_eval --note "CI: ${{ github.event.pull_request.number || github.sha }}"
          # Find the file that was just written
          RUN_FILE=$(ls -t evals/results/run_*.json | head -n 1)
          echo "run_file=$RUN_FILE" >> "$GITHUB_OUTPUT"
          echo "Run file: $RUN_FILE"

      - name: Score the run with LLM-as-judge
        id: score_eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m scripts.score_eval "${{ steps.run_eval.outputs.run_file }}"
          SCORED_FILE=$(ls -t evals/results/scored_*.json | head -n 1)
          echo "scored_file=$SCORED_FILE" >> "$GITHUB_OUTPUT"
          echo "Scored file: $SCORED_FILE"

      - name: Format eval summary as Markdown
        if: always() && steps.score_eval.outputs.scored_file != ''
        run: |
          python -m scripts.post_eval_summary "${{ steps.score_eval.outputs.scored_file }}" > eval_summary.md
          cat eval_summary.md

      - name: Post summary as PR comment
        if: github.event_name == 'pull_request' && steps.score_eval.outputs.scored_file != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: rag-eval-results
          path: eval_summary.md

      - name: Run quality gate (pytest)
        env:
          EVAL_GATE_FILE: ${{ steps.score_eval.outputs.scored_file }}
        run: pytest tests/test_eval_gate.py -v

      - name: Upload scored results as artifact
        if: always() && steps.score_eval.outputs.scored_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: scored-eval-${{ github.run_id }}
          path: ${{ steps.score_eval.outputs.scored_file }}
          retention-days: 30

      # Only on push-to-main runs that passed the gate: refresh last_main.json.
      # This is what the regression check compares future runs against.
      - name: Refresh last_main.json (on main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          cp "${{ steps.score_eval.outputs.scored_file }}" evals/results/last_main.json
          echo "last_main.json updated. Note: this is built artifact, not auto-committed."
          # If you want this auto-committed back to main, add a peter-evans/create-pull-request
          # step here. For now we leave it as a workflow artifact only.
